# ---------------------------------------------------------------------------
# STDIO transport: stdout is reserved for MCP JSON-RPC messages.
# Anything else printed to stdout (banner, logs) would corrupt the protocol.
# ---------------------------------------------------------------------------
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.console.enabled=false
logging.file.name=${java.io.tmpdir}/jvm-inspector-mcp.log

# ---------------------------------------------------------------------------
# MCP server identity
# ---------------------------------------------------------------------------
spring.ai.mcp.server.name=jvm-inspector
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.type=sync
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.instructions=Inspects Java Virtual Machines running on the local machine. \
  Start with list_jvms to discover process ids (pid), then use the other tools with that pid. \
  All tools are read-only and safe to call on production-like processes.
